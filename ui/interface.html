<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sample Renamer</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #1e1e1e;
        color: #f5f5f5;
      }

      h1 {
        margin: 0 0 12px 0;
        font-size: 18px;
      }

      p {
        margin: 0 0 12px 0;
        color: #cfcfcf;
        font-size: 14px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        margin-bottom: 14px;
        border: 1px solid #555;
        border-radius: 8px;
        background: #2a2a2a;
        color: #fff;
        font-size: 14px;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }

      .primary {
        background: #4c8bf5;
        color: white;
      }

      .secondary {
        background: #444;
        color: white;
      }
    </style>
    <script>
       const hostBridge =
        window.webkit?.messageHandlers?.live ??
        window.chrome?.webview ??
        null;

      function sendToHost(payload) {
        if (!hostBridge) return;

        if (typeof hostBridge.postMessage === "function") {
          hostBridge.postMessage(payload);
        }
      }

      function closeWithResult(result) {
        sendToHost({
          method: "close_and_send",
          params: [String(result ?? "")],
        });
      }

      function submitName() {
        const input = document.getElementById("baseName");
        if (!input) return;

        const value = input.value.trim();

        if (!value) {
          input.focus();
          return;
        }

        closeWithResult(value);
      }

      function cancelDialog() {
        closeWithResult("");
      }

      window.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById("baseName");
        const submitButton = document.getElementById("submitButton");
        const cancelButton = document.getElementById("cancelButton");

        if (input) {
          input.value = "";
          input.focus();

          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              submitName();
            } else if (event.key === "Escape") {
              event.preventDefault();
              cancelDialog();
            }
          });
        }

        if (submitButton) {
          submitButton.addEventListener("click", submitName);
        }

        if (cancelButton) {
          cancelButton.addEventListener("click", cancelDialog);
        }
      });
    </script>
  </head>
  <body>
    <h1>Sample Renamer</h1>
    <p>Type the clip name you want.</p>
    <input id="baseName" type="text" placeholder="Type a base name" value="" />
    <div class="row">
      <button id="submitButton" class="primary" type="button">Rename Clips</button>
      <button id="cancelButton" class="secondary" type="button">Cancel</button>
    </div>
  </body>
</html>
